name: Build

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          cache: npm
      - name: Install locked dependencies
        run: npm ci
      - name: Check and build
        run: npm run check
      - name: Audit dependencies
        run: npm audit --audit-level=high
      - name: Install browser
        run: npx playwright-core install --with-deps chromium
      - name: Install Chinese screenshot fonts
        run: |
          markdang_font_dir="$HOME/.local/share/fonts/markdang"
          mkdir -p "$markdang_font_dir"
          curl --fail --location --retry 2 --connect-timeout 15 --max-time 60 \
            https://raw.githubusercontent.com/notofonts/noto-cjk/f8d157532fbfaeda587e826d4cd5b21a49186f7c/Sans/OTF/SimplifiedChinese/NotoSansCJKsc-Regular.otf \
            --output "$markdang_font_dir/NotoSansCJKsc-Regular.otf"
          fc-cache "$markdang_font_dir"
      - name: Browser regression tests
        run: npm run test:e2e
      - name: Capture store screenshots
        run: npm run store:screenshots
      - name: Package the checked build
        run: node scripts/zip.mjs
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: markdang-${{ github.sha }}
          path: dist/*.zip
          if-no-files-found: error
          retention-days: 14
      - name: Upload store screenshots
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: store-screenshots-${{ github.sha }}
          path: artifacts/store-screenshots/
          if-no-files-found: warn
          retention-days: 14
      - name: Upload popup previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: popup-previews-${{ github.sha }}
          path: artifacts/popup/*.png
          if-no-files-found: warn
          retention-days: 14
      - name: Upload setup previews
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: setup-previews-${{ github.sha }}
          path: artifacts/setup/*.png
          if-no-files-found: warn
          retention-days: 14
