name: ✨ 功能建议 / Feature request
description: 建议新功能或改进 / Suggest a new feature or improvement
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题 / Problem to solve
      description: 描述使用场景 / describe the use case
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案 / Proposed solution
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: 确认 / Confirm
      options:
        - label: 官方商店版无此功能，或实现方式不同 / not available or different in the official build
        - label: 愿意提交 PR / willing to submit a PR
