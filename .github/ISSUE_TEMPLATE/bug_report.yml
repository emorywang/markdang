name: 🐞 Bug 报告 / Bug report
description: 报告阅读器的功能或渲染问题 / Report a rendering or feature problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请先确认使用的是最新构建，且三套测试在本地通过。
        Thanks! Please make sure you are on the latest build.
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现 / Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本 / Browser & version
      placeholder: Edge 130.0.x / Chrome 131.0.x
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 示例文件 / Sample markdown
      description: 可脱敏的最小复现文件 / minimal reproducible markdown
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Extra
      description: 控制台报错、截图、相关设置
