name: 🐞 Bug 报告 / Bug report
description: 报告阅读器的功能或渲染问题 / Report a rendering or feature problem
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        感谢反馈！请提供扩展版本、浏览器版本与最小复现步骤；无需先运行项目测试。
        Thanks! Please make sure you are on the latest build.
  - type: input
    id: version
    attributes:
      label: 扩展版本 / Extension version
      placeholder: 1.0.0
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: 复现步骤 / Steps to reproduce
      placeholder: |
        1. 打开 …
        2. 点击 …
        3. 出现 …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: 期望表现 / Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: 实际表现 / Actual behavior
    validations:
      required: true
  - type: input
    id: browser
    attributes:
      label: 浏览器与版本 / Browser & version
      placeholder: Chrome / Edge version
    validations:
      required: true
  - type: textarea
    id: sample
    attributes:
      label: 示例文件 / Sample markdown
      description: 可脱敏的最小复现文件 / minimal reproducible markdown
  - type: textarea
    id: extra
    attributes:
      label: 补充信息 / Extra
      description: 控制台报错、截图、相关设置
